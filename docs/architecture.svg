<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1090" viewBox="0 0 1480 1090" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <!-- Rendered from docs/architecture.drawio (edit that file in draw.io, then update this one) -->
  <defs>
    <style>
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #333; }
      .b { font-weight: 700; }
      .c { text-anchor: middle; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .orange { stroke: #C05A1C; stroke-width: 2.5; fill: none; }
      .purple { stroke: #6741D9; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1C"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6741D9"/></marker>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>

  <rect width="1480" height="1090" fill="#FFFFFF"/>

  <!-- Region -->
  <rect x="20" y="130" width="1440" height="890" rx="8" fill="#EEF0F4" stroke="#B8BCC6" stroke-width="2"/>
  <text x="36" y="158" class="b" font-size="14">AWS Region</text>
  <text x="130" y="158" class="mono" fill="#555">var.region = us-east-1</text>

  <!-- VPC -->
  <rect x="50" y="190" width="950" height="800" rx="8" fill="#FFFFFF" stroke="#3D4FC4" stroke-width="2.5"/>
  <text x="66" y="234" class="b" fill="#2B4FB3">VPC demo-eks-vpc</text>
  <text x="66" y="252" class="mono">10.0.0.0/16 · DNS hostnames on</text>

  <!-- AZs -->
  <rect x="80" y="262" width="430" height="560" rx="6" fill="none" stroke="#B8BCC6" stroke-dasharray="6 5"/>
  <text x="92" y="278" font-size="12" fill="#555">AZ 1 · us-east-1a</text>
  <rect x="540" y="262" width="430" height="560" rx="6" fill="none" stroke="#B8BCC6" stroke-dasharray="6 5"/>
  <text x="552" y="278" font-size="12" fill="#555">AZ 2 · us-east-1b</text>

  <!-- Public subnets -->
  <rect x="100" y="290" width="390" height="180" rx="6" fill="#E6F2E6" stroke="#2E7D32" stroke-width="2"/>
  <text x="114" y="313" class="b" fill="#2E7D32">Public subnet</text>
  <text x="114" y="331" class="mono">10.0.1.0/24 · role/elb</text>
  <rect x="560" y="290" width="390" height="180" rx="6" fill="#E6F2E6" stroke="#2E7D32" stroke-width="2"/>
  <text x="574" y="313" class="b" fill="#2E7D32">Public subnet</text>
  <text x="574" y="331" class="mono">10.0.2.0/24 · role/elb</text>

  <!-- Private subnets -->
  <rect x="100" y="510" width="390" height="295" rx="6" fill="#E6ECF8" stroke="#2B4FB3" stroke-width="2"/>
  <text x="114" y="533" class="b" fill="#2B4FB3">Private subnet</text>
  <text x="114" y="551" class="mono">10.0.101.0/24 · internal-elb</text>
  <rect x="560" y="510" width="390" height="295" rx="6" fill="#E6ECF8" stroke="#2B4FB3" stroke-width="2"/>
  <text x="574" y="533" class="b" fill="#2B4FB3">Private subnet</text>
  <text x="574" y="551" class="mono">10.0.102.0/24 · internal-elb</text>

  <!-- Node group -->
  <rect x="115" y="590" width="820" height="120" rx="8" fill="none" stroke="#2B4FB3" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="385" y="696" width="280" height="28" rx="14" fill="#FFFFFF" stroke="#2B4FB3"/>
  <text x="525" y="715" class="b c" font-size="12" fill="#2B4FB3">Managed node group · min 1 / 2 / max 3</text>

  <!-- Route tables -->
  <rect x="80" y="845" width="430" height="110" rx="6" fill="#FFFFFF" stroke="#B8BCC6"/>
  <text x="96" y="870" class="b" fill="#2E7D32">public-rt</text>
  <text x="170" y="870" font-size="12" fill="#333">→ both public subnets</text>
  <text x="96" y="898" class="mono">10.0.0.0/16 → local</text>
  <text x="96" y="920" class="mono">0.0.0.0/0 → Internet Gateway</text>
  <rect x="540" y="845" width="430" height="110" rx="6" fill="#FFFFFF" stroke="#B8BCC6"/>
  <text x="556" y="870" class="b" fill="#2B4FB3">private-rt</text>
  <text x="634" y="870" font-size="12" fill="#333">→ both private subnets</text>
  <text x="556" y="898" class="mono">10.0.0.0/16 → local</text>
  <text x="556" y="920" class="mono">0.0.0.0/0 → NAT Gateway</text>

  <!-- Top row -->
  <ellipse cx="380" cy="50" rx="100" ry="30" class="box"/>
  <text x="380" y="55" class="b c" font-size="14">Internet</text>
  <rect x="620" y="20" width="220" height="60" rx="6" class="box"/>
  <text x="730" y="45" class="b c">Amazon S3</text>
  <text x="730" y="66" class="mono c">public AWS endpoint</text>
  <rect x="1100" y="20" width="260" height="60" rx="6" class="box"/>
  <text x="1230" y="45" class="b c">Your laptop</text>
  <text x="1230" y="66" class="mono c">kubectl · terraform · aws</text>

  <!-- IGW -->
  <rect x="280" y="168" width="200" height="44" rx="6" class="box"/>
  <text x="380" y="195" class="b c" font-size="14">Internet Gateway</text>

  <!-- Public subnet contents -->
  <rect x="115" y="360" width="140" height="70" fill="none" stroke="#2E7D32" stroke-dasharray="5 4"/>
  <text x="185" y="391" class="c" font-size="12" fill="#333">Load</text>
  <text x="185" y="407" class="c" font-size="12" fill="#333">balancers</text>
  <rect x="280" y="360" width="190" height="70" rx="6" class="box"/>
  <text x="375" y="390" class="b c">NAT Gateway</text>
  <text x="375" y="410" class="mono c">+ Elastic IP</text>
  <rect x="580" y="360" width="350" height="70" fill="none" stroke="#2E7D32" stroke-dasharray="5 4"/>
  <text x="755" y="391" class="c" font-size="12" fill="#333">Load balancers</text>
  <text x="755" y="407" class="c" font-size="12" fill="#333">from K8s Service type=LoadBalancer</text>

  <!-- Workers -->
  <rect x="130" y="610" width="260" height="70" rx="6" class="box"/>
  <text x="144" y="639" class="b">EC2 worker node</text>
  <text x="144" y="660" class="mono">t3.medium · AL2023 · SSM</text>
  <rect x="590" y="610" width="260" height="70" rx="6" class="box"/>
  <text x="604" y="639" class="b">EC2 worker node</text>
  <text x="604" y="660" class="mono">t3.medium · AL2023 · SSM</text>

  <!-- ENIs -->
  <rect x="160" y="748" width="200" height="40" rx="5" fill="#EFE7FA" stroke="#8A63D2" stroke-width="1.5"/>
  <text x="260" y="773" class="c" font-size="12">EKS control-plane ENI</text>
  <rect x="620" y="748" width="200" height="40" rx="5" fill="#EFE7FA" stroke="#8A63D2" stroke-width="1.5"/>
  <text x="720" y="773" class="c" font-size="12">EKS control-plane ENI</text>

  <!-- EKS control plane -->
  <rect x="1050" y="290" width="380" height="270" rx="8" fill="#EFE7FA" stroke="#6741D9" stroke-width="2.5"/>
  <text x="1066" y="318" class="b" fill="#6741D9" font-size="14">EKS control plane</text>
  <text x="1066" y="338" class="mono" fill="#444">demo-eks · AWS-managed account</text>
  <text x="1066" y="372">API server · etcd · scheduler</text>
  <text x="1066" y="404" class="mono" fill="#444">endpoint: public + private</text>
  <text x="1066" y="424" class="mono" fill="#444">auth: API_AND_CONFIG_MAP</text>
  <text x="1066" y="444" class="mono" fill="#444">add-on: eks-pod-identity-agent</text>
  <text x="1066" y="484" fill="#444">role: demo-eks-cluster-role</text>

  <!-- IAM roles -->
  <rect x="1050" y="660" width="380" height="330" rx="8" class="box"/>
  <text x="1066" y="690" class="b" font-size="14">IAM roles</text>
  <text x="1066" y="722">demo-eks-cluster-role</text>
  <text x="1066" y="741" class="mono" fill="#555">AmazonEKSClusterPolicy</text>
  <text x="1066" y="774">demo-eks-node-role</text>
  <text x="1066" y="793" class="mono" fill="#555">EKSWorkerNode · EKS_CNI</text>
  <text x="1066" y="811" class="mono" fill="#555">EC2ContainerRegistryReadOnly</text>
  <text x="1066" y="829" class="mono" fill="#555">AmazonSSMManagedInstanceCore</text>
  <text x="1066" y="862">demo-eks-my-app</text>
  <text x="1066" y="881" class="mono" fill="#555">AmazonS3ReadOnlyAccess</text>
  <text x="1066" y="903" font-size="12" fill="#555">pods with SA default/my-app,</text>
  <text x="1066" y="921" font-size="12" fill="#555">through Pod Identity</text>

  <!-- ===== Edges ===== -->
  <!-- Internet <-> IGW -->
  <line x1="380" y1="82" x2="380" y2="166" stroke="#111" stroke-width="2.5" marker-start="url(#ak)" marker-end="url(#ak)"/>

  <!-- Egress via NAT (orange) -->
  <line x1="378" y1="360" x2="378" y2="214" class="orange" marker-end="url(#ao)"/>
  <path d="M460 168 V112 H730 V82" class="orange" marker-end="url(#ao)"/>
  <text x="742" y="106" class="b" font-size="12" fill="#C05A1C">S3 API, HTTPS</text>
  <line x1="338" y1="610" x2="338" y2="432" class="orange" marker-end="url(#ao)"/>
  <path d="M720 610 V490 H413 V432" class="orange" marker-end="url(#ao)"/>

  <!-- Kubernetes API traffic (purple) -->
  <line x1="1230" y1="80" x2="1230" y2="288" class="purple" marker-end="url(#ap)"/>
  <text x="1242" y="176" font-size="12" fill="#333">HTTPS 443</text>
  <text x="1242" y="193" font-size="12" fill="#333">public endpoint</text>
  <path d="M1050 520 H1020 V768 H824" class="purple" stroke-width="2" marker-end="url(#ap)"/>
  <text x="1034" y="600" font-size="12" fill="#333" transform="rotate(90 1034 600)">cross-account ENIs</text>

  <!-- Nodes to API via private endpoint (dashed purple) -->
  <line x1="260" y1="680" x2="260" y2="748" stroke="#6741D9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="720" y1="680" x2="720" y2="748" stroke="#6741D9" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- IAM role assumed (dotted grey) -->
  <line x1="1240" y1="560" x2="1240" y2="660" stroke="#555" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="1252" y="615" font-size="12" fill="#333">assumes</text>

  <!-- ===== Legend ===== -->
  <line x1="30" y1="1060" x2="70" y2="1060" class="orange"/>
  <text x="78" y="1065">Egress via NAT (images, S3)</text>
  <line x1="320" y1="1060" x2="360" y2="1060" class="purple"/>
  <text x="368" y="1065">Kubernetes API traffic</text>
  <line x1="580" y1="1060" x2="620" y2="1060" stroke="#6741D9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="628" y="1065">Nodes to API, private endpoint</text>
  <line x1="890" y1="1060" x2="930" y2="1060" stroke="#555" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="938" y="1065">IAM role assumed</text>
</svg>
