# ServiceAccount used by Pod Identity (association: default/my-app -> demo-eks-my-app)
# If you already created it with `k create serviceaccount my-app`, apply is a no-op for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      serviceAccountName: my-app # Pod Identity gives these pods the demo-eks-my-app role

      topologySpreadConstraints:
        # Rule 1 (hard): spread evenly across AZs.
        # With 4 replicas and 2 AZs -> 2 per AZ. A pod stays Pending rather than break the rule.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: my-app

        # Rule 2 (soft): also spread across nodes. Preferred, but the scheduler
        # still places the pod if it can't satisfy it.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: my-app

      containers:
        - name: aws-cli
          image: amazon/aws-cli:latest
          command: ["/bin/sh", "-c"]
          # Every 60s: print which IAM role the pod has, which AZ/node it's on, and list S3 buckets
          args:
            - |
              echo "booting..."; sleep 20                  # simulate a slow start
              touch /tmp/started /tmp/ready /tmp/healthy   # files the probes check
              while true; do
                echo "--- $(date) node=$NODE_NAME"
                aws sts get-caller-identity --query Arn --output text
                aws s3 ls || echo "s3 ls failed"
                sleep 60
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 256Mi

          # Startup: allows up to 60s (12 x 5s) to boot. Liveness/readiness wait until it passes.
          startupProbe:
            exec: { command: ["cat", "/tmp/started"] }
            periodSeconds: 5
            failureThreshold: 12

          # Readiness: fail -> pod removed from Service endpoints (READY 0/1), NOT restarted.
          readinessProbe:
            exec: { command: ["cat", "/tmp/ready"] }
            periodSeconds: 5
            failureThreshold: 1

          # Liveness: fail 3 times in a row -> container restarted (RESTARTS +1).
          livenessProbe:
            exec: { command: ["cat", "/tmp/healthy"] }
            periodSeconds: 10
            failureThreshold: 3
